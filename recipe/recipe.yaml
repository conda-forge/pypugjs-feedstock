schema_version: 1

context:
  version: 7.0.0

package:
  name: pypugjs
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pypugjs/pypugjs-${{ version }}.tar.gz
  sha256: 95bb872afe09a0fa367b589e43b623924e4dd8201a6d61562c0b21614a8a4e67

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pypugjs = pypugjs.convert:convert_file

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - charset-normalizer >=3.4.9
    - six >=1.17.0

tests:
  - python:
      imports:
        - pypugjs
      pip_check: true
      python_version:
      - ${{ python_min }}.*
      - '*'
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - pypugjs --help

about:
  summary: PugJS syntax template adapter for Django, Jinja2, Mako and Tornado templates
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/kakulukia/pypugjs

extra:
  recipe-maintainers:
    - kiwi0fruit
    - mfansler
    - jsmolic
